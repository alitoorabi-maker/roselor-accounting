name: Build Roselor Supervisor APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-supervisor-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch public Firebase Android configuration
        run: |
          curl --fail --silent --show-error \
            https://amiahhuapkqwbtcsmzal.supabase.co/functions/v1/roselor-supervisor-firebase-config \
            -o "$RUNNER_TEMP/supervisor-firebase-config.json"
          jq -e '.ok == true and (.config.configFileContents | type == "string")' "$RUNNER_TEMP/supervisor-firebase-config.json" >/dev/null
          jq -r '.config.configFileContents' "$RUNNER_TEMP/supervisor-firebase-config.json" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
          grep -F '"package_name": "ir.roselor.supervisor"' android/app/google-services.json
      - name: Build supervisor APK
        working-directory: android
        run: gradle assembleDebug
      - name: Verify APK version and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='4' versionName='1.0.3'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "android/app/build/outputs/apk/debug/roselor-supervisor-v1.0.3.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: roselor-supervisor-v1.0.3-fcm
          path: android/app/build/outputs/apk/debug/roselor-supervisor-v1.0.3.apk
          retention-days: 30
