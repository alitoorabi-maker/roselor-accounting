name: Publish Roselor Supervisor Portal
on:
  push:
    branches: [main]
    paths:
      - "supervisor-portal.html"
      - ".github/workflows/supervisor-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare portal
        run: |
          mkdir -p public
          cp supervisor-portal.html public/index.html\n          cp supervisor-portal.html public/supervisor-portal.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
