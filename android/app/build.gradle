plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    sourceSets { main.java.srcDirs += 'src/main/src/main/java' }
    namespace 'ir.roselor.supervisor'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.roselor.supervisor.fcm'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.3'
    }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}