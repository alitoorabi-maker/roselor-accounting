plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'ir.roselor.driver'
    compileSdk 36
    sourceSets { main.java.srcDirs += 'src/main/src/main/java' }
    defaultConfig {
        applicationId 'ir.roselor.driver'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2.1'
    }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}