plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'ir.roselor.accounting'
    compileSdk 36

    sourceSets {
        main {
            java.srcDirs = ['src/main/src/main/java']
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksPath == null || ksPath.isEmpty()) {
                throw new GradleException('ANDROID_KEYSTORE_PATH is required for release signing')
            }
            storeFile file(ksPath)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'ir.roselor.accounting'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}
