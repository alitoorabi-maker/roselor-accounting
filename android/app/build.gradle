
plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.roselor.accounting'
    compileSdk 35

    sourceSets {
        main {
            java.srcDirs = ['src/main/src/main/java']
        }
    }

    defaultConfig {
        applicationId 'ir.roselor.accounting'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.0.1'
    }
}
