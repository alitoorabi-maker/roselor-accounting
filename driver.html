<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082c22"><title>پنل راننده | رز لر</title><style>:root{--g:#082c22;--g2:#123c2e;--gold:#d4b45b;--line:#315747;--txt:#f7f3e8}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--txt);font-family:Tahoma,Arial,sans-serif;padding:16px;line-height:1.8}.wrap{max-width:760px;margin:auto}.brand{text-align:center;color:var(--gold);font-size:24px;font-weight:bold;margin:12px 0}.sub{text-align:center;color:#c8d7ce;margin-bottom:22px}.card{background:linear-gradient(145deg,#103729,#09271e);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}h2{font-size:19px;color:var(--gold);margin:0 0 12px}label{display:block;margin:10px 0 4px}input,button,textarea{font:inherit;width:100%;border-radius:11px;padding:12px;border:1px solid var(--line);background:#061e17;color:var(--txt)}button{background:var(--gold);color:#10271d;font-weight:bold;border:0;margin-top:12px;cursor:pointer}button.secondary{background:#1d4b39;color:white;border:1px solid var(--gold)}.row{display:flex;gap:10px;align-items:center}.row input[type=checkbox]{width:auto}.muted{color:#b9c9bf;font-size:13px}.msg{padding:10px;border-radius:10px;background:#3b211e;color:#ffd0c7;margin:10px 0}.hidden{display:none!important}.shipment{border:1px solid var(--line);padding:14px;border-radius:13px;margin:12px 0}.pill{display:inline-block;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:2px 10px;font-size:12px}.title{font-weight:bold;font-size:17px}.foot{font-size:12px;text-align:center;color:#9eb6a7;margin:24px}</style></head><body><main class="wrap"><div class="brand">🌹 رز لر | پنل راننده</div><div class="sub">بارهای تخصیص‌یافته، تحویل و درخواست کرایه</div><section id="login" class="card"><h2>ورود راننده</h2><form id="loginForm"><label>نام کاربری</label><input id="username" autocomplete="username" required autocapitalize="none"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">ورود به پنل</button></form><div id="loginMsg" class="msg hidden"></div></section><section id="panel" class="hidden"><div class="card"><div class="row"><div style="flex:1"><h2 id="driverHeading">پنل راننده</h2><div id="driverInfo" class="muted"></div></div><button class="secondary" id="logout" style="width:auto;margin:0">خروج</button></div><button class="secondary" id="refresh">به‌روزرسانی بارها</button></div><div class="card"><h2>بارهای من</h2><div class="muted">فقط بارهای تخصیص‌یافته به شما نمایش داده می‌شود.</div><div id="shipments"></div></div><div class="card"><h2>درخواست کرایه</h2><div class="muted">بارهای موردنظر را از فهرست بالا انتخاب کنید.</div><label>مبلغ درخواستی (ریال)</label><input id="freightAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="مبلغ به ریال"><label>توضیحات راننده</label><textarea id="freightNote" rows="2" placeholder="توضیح اختیاری"></textarea><button id="freightBtn">ثبت درخواست کرایه</button><div id="freightMsg" class="msg hidden"></div></div></section><div class="foot">رز لر • دسترسی فقط به بارهای مرتبط با حساب راننده</div></main><script>
const BASE="https://amiahhuapkqwbtcsmzal.supabase.co",KEY="sb_publishable_Pmkqa_CAi9O_jZQDBt4aHA_FSgikXZu",LOGIN=BASE+"/functions/v1/roselor-driver-login",API=BASE+"/functions/v1/roselor-driver-api";let session=null,profile=null;
const $=id=>document.getElementById(id);function say(id,t,show=true){$(id).textContent=t;$(id).classList.toggle("hidden",!show)}
async function call(action,extra={}){if(!session?.access_token)throw Error("ابتدا وارد شوید.");const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json",apikey:KEY,authorization:"Bearer "+session.access_token},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw Error(d.error||"خطای ارتباط");return d}
function fmtDate(v){try{return new Intl.DateTimeFormat("fa-IR",{dateStyle:"medium"}).format(new Date(v))}catch{return "—"}}function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function enter(){const d=await call("profile");profile=d.driver;$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("driverHeading").textContent="سلام "+profile.driver_name;$("driverInfo").textContent="گلخانه: "+(profile.greenhouse==="azna"?"ازنا":"خرم‌آباد");await loadShipments()}
async function loadShipments(){const box=$("shipments");box.innerHTML="در حال دریافت…";try{const d=await call("my_shipments"),items=d.shipments||[];box.innerHTML=items.length?items.map(x=>'<div class="shipment"><div class="row"><input type="checkbox" class="pick" value="'+safe(x.id)+'" '+(x.status==="delivered"?"disabled":"")+'><div style="flex:1"><div class="title">بار '+safe(x.id)+'</div><div class="muted">'+fmtDate(x.shipped_at)+' • '+safe(x.quantity_bundles)+' دسته • '+safe(x.bucket_count||0)+' سطل</div><div class="muted">وضعیت: '+(x.status==="delivered"?"تحویل‌شده":"در مسیر")+'</div></div><span class="pill">'+(x.status==="delivered"?"تحویل":"بار")+'</span></div>'+(x.status!=="delivered"?'<button class="secondary delivered" data-id="'+safe(x.id)+'">تأیید تحویل بار</button>':'')+'</div>').join(""):'<div class="muted">فعلاً باری برای حساب شما ثبت نشده است.</div>';box.querySelectorAll(".delivered").forEach(b=>b.onclick=async()=>{if(!confirm("تحویل این بار را ثبت کنم؟"))return;b.disabled=true;try{await call("mark_delivered",{shipment_id:b.dataset.id});await loadShipments()}catch(e){alert(e.message);b.disabled=false}})}catch(e){box.textContent=e.message}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;say("loginMsg","در حال ورود…");try{const r=await fetch(LOGIN,{method:"POST",headers:{"content-type":"application/json",apikey:KEY},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error||"ورود ناموفق");session=d;await enter()}catch(e){say("loginMsg",e.message)}finally{$("loginBtn").disabled=false}};
$("logout").onclick=()=>{session=null;profile=null;$("panel").classList.add("hidden");$("login").classList.remove("hidden");$("password").value=""};$("refresh").onclick=loadShipments;
$("freightBtn").onclick=async()=>{const ids=[...document.querySelectorAll(".pick:checked")].map(x=>x.value),amount=Number($("freightAmount").value);if(!ids.length){say("freightMsg","حداقل یک بار انتخاب کن.");return}if(!Number.isSafeInteger(amount)||amount<1){say("freightMsg","مبلغ معتبر به ریال وارد کن.");return}$("freightBtn").disabled=true;try{await call("request_freight",{shipment_ids:ids,requested_amount_rial:amount,driver_note:$("freightNote").value});say("freightMsg","درخواست کرایه ثبت و برای بررسی مدیر ارسال شد.");$("freightAmount").value="";$("freightNote").value="";document.querySelectorAll(".pick:checked").forEach(x=>x.checked=false)}catch(e){say("freightMsg",e.message)}finally{$("freightBtn").disabled=false}};
</script></body></html>
